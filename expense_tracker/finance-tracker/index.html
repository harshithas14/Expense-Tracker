<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceHub - Smart Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 font-sans">
    <!-- Animated Background -->
    <div class="fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-600/10 via-transparent to-purple-600/10"></div>
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <!-- Logo & Branding -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 mb-4 shadow-lg shadow-blue-500/50">
                    <i class="fas fa-chart-line text-white text-2xl"></i>
                </div>
                <h1 class="text-4xl font-bold text-white mb-2">FinanceHub</h1>
                <p class="text-slate-400">Smart Expense Tracking for Modern Life</p>
            </div>

            <!-- Auth Container -->
            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-2xl">
                <!-- Login Tab -->
                <div id="login-form" class="auth-form">
                    <h2 class="text-2xl font-bold text-white mb-6">Welcome Back</h2>
                    
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                            <input 
                                type="email" 
                                id="loginEmail" 
                                placeholder="Enter your email" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                            <input 
                                type="password" 
                                id="loginPassword" 
                                placeholder="Enter your password" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>

                        <button 
                            type="submit"
                            class="w-full py-3 mt-6 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-blue-500/50 transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                        </button>

                        <div id="loginError" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-200 text-sm"></div>
                    </form>

                    <div class="mt-6 pt-6 border-t border-white/10">
                        <p class="text-center text-slate-400">Don't have an account? 
                            <button class="text-blue-400 hover:text-blue-300 font-semibold transition" onclick="toggleAuthForms()">
                                Sign Up
                            </button>
                        </p>
                    </div>
                </div>

                <!-- Signup Tab -->
                <div id="signup-form" class="auth-form hidden">
                    <h2 class="text-2xl font-bold text-white mb-6">Create Account</h2>
                    
                    <form id="signupForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                            <input 
                                type="text" 
                                id="signupName" 
                                placeholder="Enter your name" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                            <input 
                                type="email" 
                                id="signupEmail" 
                                placeholder="Enter your email" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                            <input 
                                type="password" 
                                id="signupPassword" 
                                placeholder="Create a password" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Confirm Password</label>
                            <input 
                                type="password" 
                                id="signupConfirm" 
                                placeholder="Confirm your password" 
                                required
                                class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                            >
                        </div>

                        <button 
                            type="submit"
                            class="w-full py-3 mt-6 bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-purple-500/50 transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        >
                            <i class="fas fa-user-plus mr-2"></i>Create Account
                        </button>

                        <div id="signupError" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-200 text-sm"></div>
                    </form>

                    <div class="mt-6 pt-6 border-t border-white/10">
                        <p class="text-center text-slate-400">Already have an account? 
                            <button class="text-blue-400 hover:text-blue-300 font-semibold transition" onclick="toggleAuthForms()">
                                Sign In
                            </button>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-8 text-center text-slate-500 text-sm">
                <p>Secure • Fast • Accurate</p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p class="text-white font-semibold">Loading...</p>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeFirebase } from './js/firebase.js';
        import { setupAuthListeners } from './js/auth.js';
        
        // Initialize Firebase
        initializeFirebase();
        
        // Setup authentication
        setupAuthListeners();
    </script>
</body>
</html>
